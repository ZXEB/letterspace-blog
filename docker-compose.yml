name: letterspace

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      mx-core:
        condition: service_healthy
      sitemap:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 160m
    networks: [blog-private]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  sitemap:
    image: innei/mx-server@sha256:b1c726bee1b55a6649df632ff7e37f5595d533193365e3aef48ff792d327a3ad
    entrypoint: ["node", "/site/sitemap-server.mjs"]
    environment:
      SITE_ORIGIN: "http://38.76.201.208:18080"
      API_ORIGIN: "http://mx-core:2333"
    volumes:
      - ./scripts/sitemap-server.mjs:/site/sitemap-server.mjs:ro
    expose: ["8080"]
    restart: unless-stopped
    mem_limit: 64m
    networks: [blog-private]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  mx-core:
    image: innei/mx-server@sha256:b1c726bee1b55a6649df632ff7e37f5595d533193365e3aef48ff792d327a3ad
    environment: &mx-env
      TZ: Asia/Shanghai
      NODE_ENV: production
      REDIS_HOST: redis
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: mx_blog
      PG_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PG_DATABASE: mx_blog
      SNOWFLAKE_WORKER_ID: "2"
      ALLOWED_ORIGINS: "http://38.76.201.208:18080"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MX_ENCRYPT_KEY: ${MX_ENCRYPT_KEY:?Set MX_ENCRYPT_KEY in .env}
      PORT: "2333"
    volumes:
      - mx-assets:/root/.mx-space
      - ./scripts/pg-restore-compat.sh:/usr/local/bin/pg_restore:ro
      - ./scripts/mixspace-runtime-schema.sql:/site/mixspace-runtime-schema.sql:ro
    expose:
      - "2333"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 600m
    networks: [blog-private]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:2333/api/v3/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  migrate:
    image: innei/mx-server@sha256:b1c726bee1b55a6649df632ff7e37f5595d533193365e3aef48ff792d327a3ad
    command: ["node", "migrate.mjs"]
    environment: *mx-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    mem_limit: 450m
    networks: [blog-private]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mx_blog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mx_blog
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    mem_limit: 280m
    networks: [blog-private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mx_blog -d mx_blog"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    restart: unless-stopped
    mem_limit: 96m
    networks: [blog-private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  blog-private:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mx-assets:
